<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#203831">
<meta name="description" content="موتري AR: سُق السيارة على أرضك الحقيقية عبر كاميرا الجوال، على آيفون وأندرويد.">
<title>موتري · قيادة بالواقع المعزز</title>
<link rel="stylesheet" href="../style.css">
<!-- 8th Wall engine: markerless SLAM in mobile Safari and Chrome (same build as AR-Aboden). -->
<script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}
</script>
<style>
/* Size the camera canvas from the real visual viewport in px (same fix as
   AR-Aboden). 100vw/100dvh differs from XR8's drawing size on iPhone and
   stretches the camera image. */
:root{--app-w:100vw;--app-h:100dvh}
html{background:#05070b}
body{position:fixed;left:0;top:0;width:var(--app-w);height:var(--app-h);background:#05070b}
#camerafeed{position:fixed!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;margin:0!important;padding:0!important;width:var(--app-w)!important;height:var(--app-h)!important;min-width:var(--app-w)!important;min-height:var(--app-h)!important;max-width:none!important;max-height:none!important;display:block!important;z-index:0!important;transform:none!important}
#hud{width:var(--app-w);height:var(--app-h);inset:auto;left:0;top:0}
#arIntro{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:#e3e9daf2;overflow:auto;touch-action:pan-y}
#arIntro .intro-card{width:min(420px,100%)}
#arIntro .intro-card h1{font-size:56px;margin:14px 0 6px}
#arIntro .intro-text{margin-bottom:16px}
#arError{display:none;margin-top:12px;background:#fbe3d6;color:#7a3417;border-radius:10px;padding:10px;font-size:12px;line-height:1.7}
.back{display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}
#arStatus{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 64px);left:50%;transform:translateX(-50%);max-width:90%;width:max-content;background:#f7f7eef0;border-radius:30px;padding:10px 14px;display:flex;align-items:center;gap:9px;font-size:11px;line-height:1.6}
#arStatus .status-dot{background:var(--orange)}#arStatus.ready .status-dot{background:var(--mint)}
#placement{position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto;width:min(340px,calc(100% - 32px))}
.size{display:flex;align-items:center;gap:10px;background:#f7f6eaf2;border-radius:16px;padding:6px}
.size button{width:44px;height:44px;border:0;border-radius:12px;background:#e3eadc;color:var(--ink);font-size:22px}
.size output{min-width:96px;text-align:center;font-size:12px;font-weight:bold}
#placeBtn{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--ink);color:var(--cream);font-weight:bold;font-size:16px}
#placeBtn:disabled{opacity:.5;cursor:default}
/* Minimal driving HUD: wheel, lever, and two small round buttons. */
.round{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff66;background:#10201ab3;color:#fff;font-size:18px;line-height:1;display:grid;place-items:center;padding:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#exitAr{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}
#menuBtn{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
#menu{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 50px);right:max(12px,env(safe-area-inset-right));pointer-events:auto;display:flex;flex-direction:column;gap:6px;background:#10201ad9;border-radius:16px;padding:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#menu button{border:0;border-radius:11px;background:#ffffff14;color:#fff;font-size:13px;padding:11px 14px;text-align:right;min-width:150px}
#menu button[aria-pressed=false]{opacity:.5}
#arStatus{top:max(16px,env(safe-area-inset-top))}
#hud .steering-wrap{opacity:.88}#hud .steering-wrap small,#hud .lever-label{display:none}
#hud .right-controls{width:auto}#hud .pedals{justify-content:flex-end}
/* Forward is a latch (tap on, tap off); reverse works only while held. */
.drive-buttons{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 40px);display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:auto}
.drive-btn{border:2px solid #ffffffb0;border-radius:50%;background:#10201ab8;color:#fff;display:grid;place-items:center;padding:0;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .15s,transform .1s,box-shadow .2s}
.drive-btn>*{pointer-events:none}.drive-btn b{font-size:30px;line-height:1}.drive-btn small{font-size:11px;margin-top:-10px}
#fwdBtn{width:96px;height:96px}#revBtn{width:64px;height:64px}#revBtn b{font-size:20px}#revBtn small{font-size:9px;margin-top:-6px}
#fwdBtn[aria-pressed=true]{background:#2a9d78;border-color:#d8fff0;box-shadow:0 0 0 6px #2a9d7840,0 0 22px #5ef2c070;animation:cruise 1.6s ease-in-out infinite}
#revBtn.active{background:#c4782f;transform:scale(.94)}
/* Steering: two hold buttons on the left (physical sides fixed in RTL). */
.steer-buttons{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 40px);display:flex;gap:14px;direction:ltr;pointer-events:auto}
.steer-buttons .drive-btn{width:80px;height:80px}.steer-buttons .drive-btn b{font-size:30px}
.steer-buttons .drive-btn.active{background:#2f6fb0;border-color:#dbeeff;transform:scale(.94)}
@keyframes cruise{50%{box-shadow:0 0 0 10px #2a9d7820,0 0 30px #5ef2c050}}
</style>
</head>
<body>
<canvas id="camerafeed"></canvas>
<main id="hud">
  <button id="exitAr" class="round" aria-label="خروج من الواقع المعزز">×</button>
  <button id="menuBtn" class="round" aria-label="خيارات" aria-expanded="false" hidden>⋯</button>
  <div id="menu" hidden>
    <button id="reset">↻ إعادة السيارة</button>
    <button id="move">⌖ نقل السيارة</button>
    <button id="flowersBtn" aria-pressed="true">🌹 الورود والبلورات</button>
  </div>
  <div id="arStatus" role="status"><span class="status-dot"></span><span id="statusText">تشغيل الكاميرا…</span></div>
  <section id="placement">
    <div class="size" aria-label="حجم السيارة"><button id="sizeDown" aria-label="تصغير">−</button><output id="sizeValue">35 سم</output><button id="sizeUp" aria-label="تكبير">+</button></div>
    <button id="placeBtn" disabled>ثبّت السيارة هنا</button>
  </section>
  <div class="drive-controls" id="driveControls" hidden>
    <div class="steer-buttons">
      <button id="leftBtn" class="drive-btn" aria-label="يسار: اضغط باستمرار"><b>◀</b></button>
      <button id="rightBtn" class="drive-btn" aria-label="يمين: اضغط باستمرار"><b>▶</b></button>
    </div>
    <div class="steering-wrap" hidden>
      <div id="steering" role="slider" tabindex="0" aria-label="المقود: اسحب يمينًا أو يسارًا" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" aria-orientation="horizontal">
        <svg id="steeringWheel" viewBox="0 0 160 160" aria-hidden="true">
          <circle class="wheel-halo" cx="80" cy="80" r="74"/>
          <circle class="wheel-rim" cx="80" cy="80" r="59"/>
          <path class="wheel-spoke" d="M28 63L66 76M132 63L94 76M80 139V94"/>
          <circle class="wheel-hub" cx="80" cy="80" r="21"/>
          <path class="wheel-notch" d="M80 16V28"/>
          <circle class="wheel-bolt" cx="80" cy="80" r="5"/>
        </svg>
      </div>
    </div>
    <div class="drive-buttons">
      <button id="fwdBtn" class="drive-btn" aria-pressed="false" aria-label="قدّام: اضغط مرة للمشي المستمر ومرة للوقوف"><b>▲</b><small>قدّام</small></button>
      <button id="revBtn" class="drive-btn" aria-label="رجوع: اضغط باستمرار"><b>▼</b><small>رجوع</small></button>
    </div>
    <!-- The game's lever/brake stay in the DOM for InputController but are hidden in AR. -->
    <div class="right-controls" hidden>
      <button id="precision" aria-pressed="false" hidden>قيادة دقيقة</button>
      <div class="pedals">
        <button id="brake" class="pedal brake" aria-pressed="false" aria-label="الفرامل" hidden><span class="pedal-tread" aria-hidden="true"></span><b>فرامل</b></button>
        <div id="accelerator" class="throttle-lever" role="slider" tabindex="0" aria-label="البنزين والقير: اسحب لأعلى للتقدم ولأسفل للرجوع" aria-orientation="vertical" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" aria-valuetext="محايد" data-drive="N">
          <span class="lever-label forward" aria-hidden="true">↑ قدّام</span>
          <span class="lever-track" aria-hidden="true"></span>
          <span id="throttleKnob" aria-hidden="true"><b id="throttleMode">N</b><i></i></span>
          <span class="lever-label reverse" aria-hidden="true">رجوع ↓</span>
        </div>
      </div>
    </div>
  </div>
</main>
<section id="arIntro">
  <div class="intro-card">
    <span class="eyebrow">MOTRI / AR <span>آيفون وأندرويد</span></span>
    <h1>موتري<span class="brand-dot">.</span></h1>
    <p class="tagline">السيارة على أرضك.<br><strong>وأنت تسوقها.</strong></p>
    <p class="intro-text">اسمح بالكاميرا، وجّه الجوال للأرض وحرّكه ببطء حتى تظهر السيارة، اختر حجمها ثم ثبّتها وسُقها بنفس تحكم اللعبة.</p>
    <button id="startBtn" class="start" disabled>تجهيز محرك الواقع المعزز…</button>
    <p id="loadState" class="load-state" role="status"></p>
    <div id="arError"></div>
    <a class="back" href="../">الرجوع إلى ساحة الاختبار</a>
  </div>
</section>
<div id="toast" role="status"></div>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { CONFIG, fixedSteps, damp } from '../src/core.js';
import { MotriVehicle } from '../src/vehicle.js';
import { CarVisual } from '../src/visuals.js';
import { InputController } from '../src/input.js';
import { loadVehicleModel } from '../src/models.js';
import { FlowerEffects } from '../src/flowers.js';
import { applyRosePaint } from '../src/paint.js';
window.THREE=THREE;

function syncViewport(){
  const vv=window.visualViewport;
  const w=Math.round(vv?.width||window.innerWidth||document.documentElement.clientWidth);
  const h=Math.round(vv?.height||window.innerHeight||document.documentElement.clientHeight);
  document.documentElement.style.setProperty('--app-w',w+'px');
  document.documentElement.style.setProperty('--app-h',h+'px');
  // XR8 may resize the canvas after its own pass; re-apply the CSS size and
  // keep the Three.js drawing size matched so the camera keeps its aspect.
  requestAnimationFrame(()=>{
    const c=document.getElementById('camerafeed');
    c.style.setProperty('width',w+'px','important');c.style.setProperty('height',h+'px','important');
    if(renderer)renderer.setSize(w,h,false);
  });
}
syncViewport();
window.addEventListener('resize',syncViewport,{passive:true});
window.addEventListener('orientationchange',()=>{setTimeout(syncViewport,80);setTimeout(syncViewport,350);},{passive:true});
window.visualViewport?.addEventListener('resize',syncViewport,{passive:true});
window.visualViewport?.addEventListener('scroll',syncViewport,{passive:true});

// The simulation runs in the game's own units (same tune as the test lab). Only
// the rendered root is scaled down to toy size and anchored on XR8's floor (Y=0).
// No floor is drawn: an invisible collider holds the car, and a shadow-only
// plane gives contact with the real ground.
const $=id=>document.getElementById(id);
const SIZES=[.20,.25,.30,.35,.45,.60,.80];
const SPAWN=[0,.72,0];
const MAX_DISTANCE=120;
// Same top speed as the game lab: about 0.95 m/s at the default 35 cm size.
const AR_MAX_SPEED=14;
let sizeIndex=3,carLength=5,placed=false,sceneReady=false,xrReady=false,xrStarted=false,failed=false;
let scene,camera,renderer,anchor,visual,car,input,world,sun,shadowPlane,reticle,flowers=null;
let trackingNormalSince=null,trackingLastSeen=-Infinity,trackingStatus='LIMITED';
let lastTick=0,accumulator=0,stableSince=null,toastTimer=0;
const ray=new THREE.Raycaster(),centre=new THREE.Vector2(0,0),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const hit=new THREE.Vector3(),preview=new THREE.Vector3(),lastHit=new THREE.Vector3(1e3,1e3,1e3),tmp=new THREE.Vector3();

const notify=text=>{$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200);};
const setStatus=(text,ready=false)=>{$('statusText').textContent=text;$('arStatus').classList.toggle('ready',ready);$('arStatus').hidden=false;};
const hideStatus=()=>{$('arStatus').hidden=true;};
const showMenu=open=>{$('menu').hidden=!open;$('menuBtn').setAttribute('aria-expanded',String(open));};

// Smooth steering for AR: an expo curve gives fine control near the centre,
// then the wheel angle eases toward the finger instead of snapping.
let steerSmooth=0;
function smoothInput(raw,dt){
  const curved=Math.sign(raw.steer)*Math.pow(Math.abs(raw.steer),1.7);
  steerSmooth=damp(steerSmooth,curved,curved===0?8:4.5,dt);
  if(Math.abs(steerSmooth)<.002)steerSmooth=0;
  return {...raw,steer:steerSmooth};
}
const fail=message=>{failed=true;sceneReady=false;$('arIntro').hidden=false;$('arError').style.display='block';$('arError').textContent=message;$('startBtn').disabled=false;$('startBtn').textContent='إعادة تحميل الصفحة';};
const scale=()=>SIZES[sizeIndex]/carLength;
function showSize(){$('sizeValue').textContent=`${Math.round(SIZES[sizeIndex]*100)} سم`;if(anchor)anchor.scale.setScalar(scale());}

function trackingReady(now){return trackingStatus==='NORMAL'&&trackingNormalSince!==null&&now-trackingNormalSince>=800&&now-trackingLastSeen<=250;}

function buildPhysics(){
  world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0),allowSleep:false});
  world.broadphase=new CANNON.SAPBroadphase(world);
  world.solver.iterations=14;world.defaultContactMaterial.friction=.48;world.defaultContactMaterial.restitution=.02;
  const floor=new CANNON.Body({mass:0,material:world.defaultMaterial,shape:new CANNON.Box(new CANNON.Vec3(200,.5,200))});
  floor.position.set(0,-.5,0);world.addBody(floor);
}

async function setupScene(){
  ({scene,camera,renderer}=XR8.Threejs.xrScene());
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
  syncViewport();setTimeout(syncViewport,50);setTimeout(syncViewport,250);
  scene.add(new THREE.HemisphereLight(0xffffff,0x596779,1.6));
  sun=new THREE.DirectionalLight(0xffffff,2.2);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
  Object.assign(sun.shadow.camera,{left:-1,right:1,top:1,bottom:-1,near:.01,far:6});sun.shadow.bias=-.0005;
  scene.add(sun,sun.target);
  anchor=new THREE.Group();anchor.visible=false;scene.add(anchor);
  shadowPlane=new THREE.Mesh(new THREE.PlaneGeometry(2*MAX_DISTANCE,2*MAX_DISTANCE),new THREE.ShadowMaterial({opacity:.28}));
  shadowPlane.rotation.x=-Math.PI/2;shadowPlane.position.y=.005;shadowPlane.receiveShadow=true;anchor.add(shadowPlane);
  reticle=new THREE.Mesh(new THREE.RingGeometry(.05,.065,40).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,depthWrite:false}));
  reticle.visible=false;scene.add(reticle);
  buildPhysics();
  car=new MotriVehicle(world);car.params.maxSpeed=AR_MAX_SPEED;car.params.reverseSpeed=AR_MAX_SPEED*.6;
  // Gentler wheel response and yaw assist so turns build up smoothly.
  Object.assign(car.params,{steerRate:7,steerReturnRate:9,yawAssist:3.2,maxSteer:.58});car.checkpoint=[...SPAWN];car.reset();
  visual=new CarVisual(anchor);
  input=new InputController(resetCar,()=>{});input.setEnabled(false);
  $('precision').addEventListener('click',()=>{input.precision=!input.precision;$('precision').setAttribute('aria-pressed',String(input.precision));$('precision').textContent=input.precision?'قيادة دقيقة: مفعّلة':'قيادة دقيقة';});
  let status={loaded:false};
  try{status=await loadVehicleModel(visual,'../models/vehicle.json',car);}catch(e){console.warn(e);notify('تعذر تحميل GMC؛ تظهر السيارة المؤقتة');}
  visual.sync(car);
  const box=new THREE.Box3().setFromObject(visual.root);carLength=Math.max(1,box.max.z-box.min.z);
  // Pink paint and painted roses; a procedural bouquet in the bed sheds petals
  // behind the car onto the AR floor (Y=0).
  try{status.paint=applyRosePaint(visual);flowers=new FlowerEffects({visual});}catch(e){console.warn(e);}
  showSize();
  window.__motriAr={car,visual,anchor,status,get flowers(){return flowers;},get placed(){return placed;}};
  sceneReady=true;lastTick=performance.now();
  $('arIntro').hidden=true;setStatus('وجّه الجوال للأرض وحرّكه ببطء');
}

// Forward latch and held reverse replace the lever's throttle in AR.
let cruise=false,reversing=false;
function setCruise(on){cruise=on;$('fwdBtn').setAttribute('aria-pressed',String(on));}
const steerHeld={left:false,right:false};
function driveInput(raw){return {...raw,steer:Number(steerHeld.right)-Number(steerHeld.left),throttle:reversing?-1:cruise?1:0,brake:false};}
function stopDrive(){setCruise(false);reversing=false;steerHeld.left=steerHeld.right=false;for(const id of ['revBtn','leftBtn','rightBtn'])$(id).classList.remove('active');}
function resetCar(){input?.reset();stopDrive();car.reset();accumulator=0;steerSmooth=0;visual.sync(car);}

function place(){
  if(!reticle.visible||$('placeBtn').disabled){notify('وجّه الكاميرا للأرض أولًا');return;}
  placed=true;reticle.visible=false;resetCar();
  $('placement').hidden=true;$('driveControls').hidden=false;$('menuBtn').hidden=false;input.setEnabled(true);steerSmooth=0;
  hideStatus();
}
function move(){
  placed=false;input.setEnabled(false);resetCar();flowers?.clearTrail();
  $('driveControls').hidden=true;$('menuBtn').hidden=true;showMenu(false);$('placement').hidden=false;stableSince=null;
  setStatus('وجّه الجوال للمكان الجديد');
}

function updatePreview(now){
  camera.updateMatrixWorld(true);ray.setFromCamera(centre,camera);
  const found=ray.ray.intersectPlane(ground,hit),distance=found?hit.distanceTo(camera.getWorldPosition(tmp)):Infinity;
  if(!trackingReady(now)||!found||distance<.15||distance>5||ray.ray.direction.y>-.12){
    reticle.visible=false;anchor.visible=false;stableSince=null;$('placeBtn').disabled=true;
    setStatus(trackingReady(now)?'وجّه الجوال نحو الأرض أمامك':'حرّك الجوال ببطء حتى يستقر التتبع');return;
  }
  if(stableSince===null||lastHit.distanceTo(hit)>.18){stableSince=now;preview.copy(hit);}
  else preview.lerp(hit,.35);
  lastHit.copy(hit);preview.y=0;
  reticle.visible=true;reticle.position.set(preview.x,.004,preview.z);
  // Face away from the viewer so "forward" on the lever drives into the scene.
  camera.getWorldDirection(tmp);
  anchor.position.copy(preview);anchor.rotation.set(0,Math.atan2(tmp.x,tmp.z),0);anchor.visible=true;showSize();
  const ready=now-stableSince>=350;$('placeBtn').disabled=!ready;
  setStatus(ready?'جاهز — اختر الحجم وثبّت السيارة':'ثبّت الجوال لحظة…',ready);
}

function tick(now){
  if(!sceneReady)return;
  const dt=Math.min(.08,Math.max(0,(now-lastTick)/1000));lastTick=now;
  if(!placed){updatePreview(now);}
  else if(trackingReady(now)&&!document.hidden){
    car.input=smoothInput(driveInput(input.read()),dt);
    const steps=fixedSteps(accumulator,dt);accumulator=steps.accumulator;
    for(let i=0;i<steps.count;i++){car.beforeStep(CONFIG.step);world.step(CONFIG.step);car.afterStep(CONFIG.step);}
    const p=car.body.position,up=new THREE.Vector3(0,1,0).applyQuaternion(visual.root.quaternion);
    if(p.y< -5||Math.hypot(p.x,p.z)>MAX_DISTANCE||(up.y<.12&&Math.abs(car.speed)<.2&&(car.upsideTime=(car.upsideTime||0)+dt)>3)){car.upsideTime=0;resetCar();notify('رجعت السيارة لمكانها');}
    else if(up.y>=.12)car.upsideTime=0;
    if(!$('arStatus').hidden)hideStatus();
  }else if(placed){accumulator=0;setStatus('التتبع ضعيف — وجّه الجوال للأرض ببطء');}
  visual.sync(car);
  if(placed)flowers?.update(dt,{speed:car.speed,maxSpeed:car.params.maxSpeed,velocity:car.body.velocity});
  visual.root.getWorldPosition(tmp);
  sun.target.position.copy(tmp);sun.position.copy(tmp).add(new THREE.Vector3(.6,2,.4));
}

function worldModule(){
  return {
    name:'motri-ar-drive',
    onStart:async()=>{try{await setupScene();}catch(e){console.error(e);fail('تعذر تجهيز السيارة: '+(e.message||e));}},
    onUpdate:({processCpuResult})=>{
      const now=performance.now(),status=processCpuResult?.reality?.trackingStatus||'LIMITED';
      trackingStatus=status;trackingLastSeen=now;
      trackingNormalSince=status==='NORMAL'?(trackingNormalSince??now):null;
      try{tick(now);}catch(e){console.error(e);fail('توقف التشغيل: '+(e.message||e));}
    },
    onCameraStatusChange:({status})=>{if(status==='failed')fail('تعذر فتح الكاميرا. اسمح بالكاميرا من إعدادات المتصفح ثم أعد المحاولة.');},
    onException:e=>{console.error(e);if(!sceneReady)fail('تعذر تشغيل التتبع على هذا الجهاز أو المتصفح.');},
  };
}

function initXR(){
  if(xrReady||!window.XR8)return;
  try{
    XR8.XrController.configure({disableWorldTracking:false,enableLighting:true,enableWorldPoints:false,scale:'responsive'});
    XR8.addCameraPipelineModules([XR8.GlTextureRenderer.pipelineModule(),XR8.Threejs.pipelineModule(),XR8.XrController.pipelineModule(),worldModule()]);
    xrReady=true;$('startBtn').disabled=false;$('startBtn').textContent='افتح الكاميرا';
  }catch(e){console.error(e);fail('لم يكتمل تحميل محرك AR.');}
}

$('startBtn').addEventListener('click',()=>{
  if(failed){location.reload();return;}
  if(!xrReady||xrStarted)return;
  xrStarted=true;$('startBtn').disabled=true;$('startBtn').textContent='تحميل السيارة…';
  $('loadState').textContent='اسمح بالكاميرا عند السؤال.';
  try{XR8.run({canvas:$('camerafeed')});syncViewport();setTimeout(syncViewport,120);setTimeout(syncViewport,500);setTimeout(syncViewport,1200);}catch(e){console.error(e);fail('تعذر تشغيل الكاميرا: '+(e.message||e));}
});
$('placeBtn').addEventListener('click',place);
$('move').addEventListener('click',()=>{showMenu(false);move();});
$('menuBtn').addEventListener('click',()=>showMenu($('menu').hidden));
$('flowersBtn').addEventListener('click',()=>{showMenu(false);if(!flowers)return;flowers.enabled=!flowers.enabled;$('flowersBtn').setAttribute('aria-pressed',String(flowers.enabled));notify(flowers.enabled?'الورود والبلورات تعمل':'توقف نثر الورود والبلورات');});
$('reset').addEventListener('click',()=>{showMenu(false);resetCar();notify('رجعت السيارة لمكانها');});
$('sizeDown').addEventListener('click',()=>{sizeIndex=Math.max(0,sizeIndex-1);showSize();});
$('sizeUp').addEventListener('click',()=>{sizeIndex=Math.min(SIZES.length-1,sizeIndex+1);showSize();});
$('exitAr').addEventListener('click',()=>{try{XR8.stop();}catch{}location.href='../';});
document.addEventListener('visibilitychange',()=>{trackingNormalSince=null;lastTick=performance.now();input?.reset();stopDrive();});
$('fwdBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(!placed)return;setCruise(!cruise);if(cruise){reversing=false;$('revBtn').classList.remove('active');}});
{
  const rev=$('revBtn'),release=e=>{if(rev.hasPointerCapture?.(e.pointerId))rev.releasePointerCapture(e.pointerId);reversing=false;rev.classList.remove('active');};
  rev.addEventListener('pointerdown',e=>{e.preventDefault();if(!placed)return;rev.setPointerCapture(e.pointerId);reversing=true;setCruise(false);rev.classList.add('active');});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>rev.addEventListener(ev,release));
}
for(const [id,side] of [['leftBtn','left'],['rightBtn','right']]){
  const b=$(id),release=e=>{if(b.hasPointerCapture?.(e.pointerId))b.releasePointerCapture(e.pointerId);steerHeld[side]=false;b.classList.remove('active');};
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(!placed)return;b.setPointerCapture(e.pointerId);steerHeld[side]=true;b.classList.add('active');});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,release));
}
window.addEventListener('blur',stopDrive);
$('driveControls').hidden=true;
if(window.XR8)initXR();else window.addEventListener('xrloaded',initXR,{once:true});
setTimeout(()=>{if(!xrReady&&!failed)$('loadState').textContent='محرك AR يتأخر. تحقق من الاتصال ثم أعد تحميل الصفحة.';},12000);
</script>
</body>
</html>
