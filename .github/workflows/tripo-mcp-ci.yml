name: Tripo MCP checks

on:
  push:
    paths:
      - "tools/tripo-mcp/**"
      - ".github/workflows/tripo-mcp-ci.yml"
  pull_request:
    paths:
      - "tools/tripo-mcp/**"
      - ".github/workflows/tripo-mcp-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: tools/tripo-mcp
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: tools/tripo-mcp
        run: npm run typecheck
