name: Deploy Jood multiplayer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install relay dependencies
        working-directory: tools/jood-multiplayer
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Deploy the room relay Worker
        working-directory: tools/jood-multiplayer
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npx wrangler deploy | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Store the owner's join-notification settings, if set
        working-directory: tools/jood-multiplayer
        run: |
          put(){ printf '%s' "$2" | npx wrangler secret put "$1"; }
          [ -n "$NTFY_TOPIC" ] && put NTFY_TOPIC "$NTFY_TOPIC"
          [ -n "$NTFY_TOKEN" ] && put NTFY_TOKEN "$NTFY_TOKEN"
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            put TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
            # No chat id given: take it from the last message sent to the bot.
            echo "Bot: $(curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe" | jq -c '{ok, username: .result.username, error: .description}')"
            if [ -z "$TELEGRAM_CHAT_ID" ]; then
              updates=$(curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates")
              echo "Updates: $(echo "$updates" | jq -c '{ok, count: (.result // [] | length), error: .description}')"
              TELEGRAM_CHAT_ID=$(echo "$updates" | jq -r '[.result[]? | (.message // .my_chat_member // .edited_message).chat.id | select(. != null)] | last // empty')
            fi
            if [ -n "$TELEGRAM_CHAT_ID" ]; then
              put TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
              curl -fsS -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=🌸 جود: وصلت الإشعارات! بيجيك تنبيه هنا لما أحد يدخل اللعبة."
            else
              echo "::warning::Send any message to your Telegram bot, then run this workflow again."
            fi
          fi
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show the server URL for multiplayer.json
        working-directory: tools/jood-multiplayer
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Relay URL: $url"
          # A new workers.dev route can take a little while to answer.
          for i in $(seq 1 12); do curl -fsS "$url/health" && break; [ "$i" = 12 ] && exit 1; sleep 10; done
          echo "### Jood multiplayer relay" >> "$GITHUB_STEP_SUMMARY"
          echo "Put this in multiplayer.json: \`{\"server\": \"$url\"}\`" >> "$GITHUB_STEP_SUMMARY"
