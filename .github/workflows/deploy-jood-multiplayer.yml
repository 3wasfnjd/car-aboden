name: Deploy Jood multiplayer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install relay dependencies
        working-directory: tools/jood-multiplayer
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Deploy the room relay Worker
        working-directory: tools/jood-multiplayer
        run: npx wrangler deploy | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show the server URL for multiplayer.json
        working-directory: tools/jood-multiplayer
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Relay URL: $url"
          curl -fsS "$url/health"
          echo "### Jood multiplayer relay" >> "$GITHUB_STEP_SUMMARY"
          echo "Put this in multiplayer.json: \`{\"server\": \"$url\"}\`" >> "$GITHUB_STEP_SUMMARY"
