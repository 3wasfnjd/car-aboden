name: Deploy Jood multiplayer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install relay dependencies
        working-directory: tools/jood-multiplayer
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Deploy the room relay Worker
        working-directory: tools/jood-multiplayer
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npx wrangler deploy | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Store the owner's ntfy topic (join notifications), if set
        working-directory: tools/jood-multiplayer
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "No NTFY_TOPIC secret: join notifications stay off."; exit 0; fi
          printf '%s' "$NTFY_TOPIC" | npx wrangler secret put NTFY_TOPIC
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show the server URL for multiplayer.json
        working-directory: tools/jood-multiplayer
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Relay URL: $url"
          # A new workers.dev route can take a little while to answer.
          for i in $(seq 1 12); do curl -fsS "$url/health" && break; [ "$i" = 12 ] && exit 1; sleep 10; done
          echo "### Jood multiplayer relay" >> "$GITHUB_STEP_SUMMARY"
          echo "Put this in multiplayer.json: \`{\"server\": \"$url\"}\`" >> "$GITHUB_STEP_SUMMARY"
